name: Refresh hatewatch data

# Runs the simulation against Neon and saves a new run.
#
# SCHEDULE. NFL games land on Thursday, Sunday and Monday, so the refresh runs
# the morning after each: Friday, Monday and Tuesday. Cron has no notion of
# daylight saving, so 14:00 UTC is 8am Central in winter and 9am in summer.
# That drift is harmless here -- the point is "the morning after", not a
# precise hour.
#
# THIS REPOSITORY IS PUBLIC, so every line of this log is world-readable.
# Nothing below echoes a secret or anything derived from one. In particular:
#   * the connection string is passed through the environment, never on a
#     command line (command lines show up in logs and in `ps`)
#   * no `set -x`, no `env` dump
#   * hatewatch.run reports connection failures without the driver's message,
#     because that message contains the host and username
#   * the deploy hook prints only an HTTP status code, never the response body

on:
  schedule:
    # Mon, Tue and Fri at 14:00 UTC.
    - cron: "0 14 * * 1,2,5"
  workflow_dispatch:

# Read-only token. This job needs nothing from the GitHub API; it only reads
# the checked-out code.
permissions:
  contents: read

concurrency:
  # Two refreshes writing to the same database at once would interleave their
  # runs. Queue instead, and never cancel one half-way through a write.
  group: hatewatch-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the code
        # v7, not v4: v4 targets Node 20, which GitHub runners now force onto
        # Node 24 with a deprecation warning. The intervening majors were the
        # Node 24 move plus, in checkout v7, refusing to check out a fork PR
        # on pull_request_target and workflow_run -- triggers this workflow
        # does not use, so nothing here changes behaviour.
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # --require-hashes is a boolean flag; passing it a value makes pip
        # exit with "option does not take a value". requirements.txt is fully
        # version-pinned, which is the protection that actually matters here.
        run: pip install -r requirements.txt

      - name: Run the simulation and save a run
        env:
          # The refresh_writer role. It can insert rows and replace the
          # season's games; it cannot create or alter a table, which is why
          # --skip-schema is passed below.
          #
          # The secret is named NEON_REFRESH_URL, matching the key in .env.
          # The first manual run failed because the secret was then named
          # something else: a missing secret expands to an empty string
          # rather than failing, so the job ran with no DATABASE_URL and died
          # further in, with an error about .env that made no sense on a CI
          # runner. Hence the explicit check below.
          DATABASE_URL: ${{ secrets.NEON_REFRESH_URL }}
        run: |
          # Check before doing anything slow, and say which secret is missing
          # rather than letting a misleading error surface three steps later.
          # -z tests emptiness only; the value is never printed.
          if [ -z "${DATABASE_URL}" ]; then
            echo "DATABASE_URL is empty."
            echo "Set the repository secret NEON_REFRESH_URL to the"
            echo "refresh_writer connection string."
            exit 1
          fi
          python -m hatewatch.run --skip-schema

      - name: Tell Vercel to rebuild
        # Skipped rather than failed when the hook is not configured, so the
        # data refresh still counts as a success on a fresh clone.
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "${HOOK}" ]; then
            echo "VERCEL_DEPLOY_HOOK is not set; skipping the rebuild."
            exit 0
          fi
          # The URL is fed to curl through a config file on stdin rather than
          # as an argument, so it never appears in the process list. printf is
          # a shell builtin, so it does not spawn a process carrying it either.
          # -o /dev/null discards the body: Vercel echoes a job id derived
          # from the hook URL. Only the status code is printed.
          code=$(printf 'url = "%s"\n' "${HOOK}" \
            | curl -sS -X POST -o /dev/null -w '%{http_code}' --config -)
          echo "Deploy hook responded: ${code}"
          case "${code}" in
            2*) exit 0 ;;
            *)  echo "Deploy hook did not accept the request."; exit 1 ;;
          esac
